name: PHP checks

on:
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  php: "
  {php: '8.2', experimental: false},
  {php: '8.3', experimental: false},
  {php: '8.4', experimental: false},
  {php: '8.5', experimental: false},
  "
  php-ext: curl, dom, fileinfo, iconv, intl, mbstring, mysql, pdo, zip

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.out }}
      php-ext: ${{ steps.set-php-ext.outputs.out }}

    steps:
      - id: set-matrix
        run: echo "out={\"include\":[${{ env.php }}]}" >> $GITHUB_OUTPUT
      - id: set-php-ext
        run: echo "out=${{ env.php-ext }}" >> $GITHUB_OUTPUT

  check-composer:
    needs: [ set-environment ]
    name: Check Composer - PHP(${{ matrix.php }}) Experimental(${{ matrix.experimental }})
    strategy:
      matrix: ${{fromJson(needs.set-environment.outputs.matrix)}}
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ needs.set-environment.outputs.php-ext }}
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Validate composer.json and composer.lock
        run: composer validate --no-cache --no-interaction
      - name: Check required php extensions
        if: "${{ matrix.experimental == false }}"
        run: composer check --no-cache
      - name: Install dependencies
        if: "${{ matrix.experimental == false }}"
        run: composer install --no-interaction --prefer-dist --no-progress --no-suggest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install experimental dependencies, ignore php requirements
        if: "${{ matrix.experimental == true }}"
        run: composer install --no-interaction --prefer-dist --no-progress --no-suggest --ignore-platform-reqs
        env:
          GH_TOKEN: ${{ github.token }}

  unittest-codecept:
    needs: [ set-environment, check-composer ]
    name: Unittest by Codecept - PHP(${{ matrix.php }}) Experimental(${{ matrix.experimental }})
    strategy:
      matrix: ${{fromJson(needs.set-environment.outputs.matrix)}}
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    # Docs: https://docs.github.com/en/actions/using-containerized-services
    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: yii
          MYSQL_PASSWORD: yii
          MYSQL_USER: yii
          MYSQL_DATABASE: yii
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ needs.set-environment.outputs.php-ext }}
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        if: "${{ matrix.experimental == false }}"
        run: composer install --no-interaction --prefer-dist --no-progress --no-suggest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install experimental dependencies, ignore php requirements
        if: "${{ matrix.experimental == true }}"
        run: composer install --no-interaction --prefer-dist --no-progress --no-suggest --ignore-platform-reqs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Copy test config.
        run: cp config/config_tests.template.json config/config_tests.json

      - name: Validate config of codecept.
        run: |
          php -d register_argc_argv=On vendor/bin/codecept --version
          php -d register_argc_argv=On vendor/bin/codecept config:validate

      - name: Run unittest.
        run: |
          php -d register_argc_argv=On vendor/bin/codecept clean
          php -d register_argc_argv=On vendor/bin/codecept build
          php -d register_argc_argv=On vendor/bin/codecept run Unit

  e2e-playwright:
    needs: [ set-environment, check-composer ]
    name: E2E (Playwright) - ${{ matrix.browser }}
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: yii
          MYSQL_PASSWORD: yii
          MYSQL_USER: yii
          MYSQL_DATABASE: yii
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      web:
        image: tobiashoessl/antragsgruen:4.17.1-full
        env:
          APP_DOMAIN: test.antragsgruen.test
          APP_PROTOCOL: http
          SITE_SUBDOMAIN: std
          DB_HOST: mysql
          DB_NAME: yii
          DB_USER: yii
          DB_PASSWORD: yii
          MAILER_DISABLED: 'true'
          MAIL_FROM_EMAIL: noreply@example.org
          RANDOM_SEED: 'deadbeefdeadbeefdeadbeefdeadbeef'
        ports:
          - 80/tcp
        options: --health-cmd="curl -fsS http://localhost/index.php" --health-interval=10s --health-timeout=5s --health-retries=12

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set /etc/hosts entry for test.antragsgruen.test
        run: |
          grep -q test.antragsgruen.test /etc/hosts || echo "127.0.0.1 test.antragsgruen.test" | sudo tee -a /etc/hosts

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir e2e exec playwright install --with-deps ${{ matrix.browser }}

      - name: Wait for web service
        run: |
          for i in {1..30}; do
            if curl -fsS http://test.antragsgruen.test/index.php > /dev/null; then
              echo "Web service is up"; break
            fi
            echo "Waiting... ($i)"; sleep 2
          done

      - name: Copy test config
        run: cp config/config_tests.template.json config/config_tests.json

      - name: Run Playwright e2e tests (${{ matrix.browser }})
        run: pnpm test:e2e --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 14
