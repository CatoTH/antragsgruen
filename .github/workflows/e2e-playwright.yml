name: Playwright e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      E2E_HOST: stdparteitag.antragsgruen.test
      E2E_PORT: 22380
    steps:
      - uses: actions/checkout@v4

      - name: Install project dependencies
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true

      - name: Install Playwright Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: Create test-only runtime overrides
        run: |
          mkdir -p .e2e-runtime/nginx
          printf '127.0.0.1 %s\n' "$E2E_HOST" | sudo tee -a /etc/hosts
          RANDOM_SEED="$(openssl rand -base64 32 | tr -d '\n')"
          cat > .e2e-runtime/config_tests.json <<EOF
          {
            "dbConnection": {"dsn": "mysql:host=127.0.0.1;port=32768;dbname=yii", "emulatePrepare": true, "username": "yii", "password": "yii", "charset": "utf8mb4"},
            "mailService": {"transport": "sendmail"},
            "prettyUrl": true,
            "baseLanguage": "de",
            "multisiteMode": true,
            "confirmEmailAddresses": true,
            "captcha": {"ignoredIps": ["127.0.0.1", "::1"]},
            "domainPlain": "",
            "domainSubdomain": "",
            "prependWWWToSubdomain": false,
            "randomSeed": "$RANDOM_SEED",
            "mailFromName": "Antragsgruen Test",
            "mailFromEmail": "test@antragsgruen.de",
            "adminUserIds": [3],
            "plugins": ["gruen_ci", "antragsgruen_sites"],
            "pdfExportConcat": true
          }
          EOF
          printf '%s\n' "$E2E_HOST" > .e2e-runtime/TEST_DOMAIN
          cat > .e2e-runtime/nginx/default.conf <<'EOF'
          server {
            server_name stdparteitag.antragsgruen.test;
            root /var/www/antragsgruen/web;
            set $yii_bootstrap index.php;
            rewrite ^/(.*)/$ /$1 permanent;
            location / {
              rewrite ^/test/(.*)$ /index.php?r=test/$1 last;
              try_files $uri $uri/ /index.php$uri?$args;
            }
            location ~ \.php {
              fastcgi_split_path_info ^(.+\.php)(.*)$;
              fastcgi_pass web:9000;
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME /var/www/antragsgruen/web/index.php;
              fastcgi_param PATH_INFO $request_uri;
              fastcgi_param PATH_TRANSLATED /var/www/antragsgruen/web/index.php;
              fastcgi_param REMOTE_ADDR 127.0.0.1;
            }
          }
          EOF
          cat > .e2e-runtime/compose.yml <<'EOF'
          services:
            web:
              volumes:
                - "./.e2e-runtime/config_tests.json:/var/www/antragsgruen/config/config_tests.json:ro"
                - "./.e2e-runtime/TEST_DOMAIN:/var/www/antragsgruen/config/TEST_DOMAIN:ro"
            nginx:
              ports: ["22380:80"]
              volumes:
                - "./.e2e-runtime/nginx:/etc/nginx/conf.d:ro"
            mysql-test:
              image: mariadb:latest
              network_mode: service:web
              depends_on:
                web: {condition: service_started}
              environment:
                MARIADB_RANDOM_ROOT_PASSWORD: "1"
                MARIADB_DATABASE: yii
                MARIADB_USER: yii
                MARIADB_PASSWORD: yii
              command: --port=32768
          EOF

      - name: Start PR-build stack
        run: |
          docker compose -f docker-compose.development.yml -f .e2e-runtime/compose.yml up -d --build web nginx mysql-test
          for i in $(seq 1 30); do
            docker compose -f docker-compose.development.yml -f .e2e-runtime/compose.yml exec -T web sh -c 'echo >/dev/tcp/127.0.0.1/32768' && break
            sleep 2
          done

      - name: Verify test endpoint
        run: |
          curl --fail-with-body -X POST -H "Host: $E2E_HOST" -d fixture=dbdata1 "http://127.0.0.1:$E2E_PORT/test/populate-db"
          curl --fail "http://127.0.0.1:$E2E_PORT/stdparteitag/std-parteitag" -o /dev/null
          curl --fail "http://127.0.0.1:$E2E_PORT/stdparteitag/rest/std-parteitag/motion/Moving_test-47262/amendment/278" -o /dev/null

      - name: TypeScript and test discovery gate
        run: |
          pnpm --dir e2e exec tsc --noEmit
          E2E_BASE_URL="http://$E2E_HOST:$E2E_PORT" pnpm --dir e2e exec playwright test --list

      - name: Run Chromium shard
        run: E2E_BASE_URL="http://$E2E_HOST:$E2E_PORT" pnpm --dir e2e exec playwright test --project=chromium --shard=${{ matrix.shard }}/8

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: e2e/test-results/
          if-no-files-found: ignore
