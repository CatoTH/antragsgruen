; LOCAL-E2E-STACK ONLY. Suppress PHP 8.5 deprecation warnings emitted by
; the PDO::MYSQL_ATTR_MULTI_STATEMENTS constant in TestController. Production
; runs on PHP < 8.5 where the constant is not deprecated; this override is
; purely here so the throwaway local stack can drive the new /test/*
; endpoints without Yii's error handler converting the deprecation into a
; 200/JSON error response. Do not include this file in any production build.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
