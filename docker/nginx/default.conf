server {
    set $host_path "/var/www/antragsgruen";
    server_name stdparteitag.antragsgruen.test;
    root   $host_path/web;
    set $yii_bootstrap "index.php";

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    client_max_body_size 32M;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;

    rewrite ^/(.*)/$ /$1 permanent;

    # LOCAL-E2E-STACK ONLY: route every non-asset request through
    # index.php with PATH_INFO preserved so the Yii URL manager can
    # resolve the original path against its rules. Without this, the
    # default try_files fall-through to /index.php loses PATH_INFO and
    # the urlManager rules never see the path. With PATH_INFO set,
    # /stdparteitag/rest/std-parteitag/motion/.../amendment/... matches
    # the multisiteMode rules and the API endpoints resolve.
    location / {
        try_files $uri $uri/ /index.php$uri?$args;
    }

    location ~ \.(js|woff|woff2)$ {
        expires 7d;
    }
    location ~ \/web.*(css|png|jpg)$ {
        expires 7d;
    }
    location /favicons {
        expires 7d;
    }

    location ~ \.php {
        fastcgi_split_path_info  ^(.+\.php)(.*)$;
        fastcgi_read_timeout 1200;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        #let yii catch the calls to unexising PHP files
        set $fsn /$yii_bootstrap;
        if (-f $document_root$fastcgi_script_name){
            set $fsn $fastcgi_script_name;
        }

        fastcgi_pass web:9000;
        include fastcgi_params;

        fastcgi_param  SCRIPT_FILENAME  $document_root$fsn;

        # LOCAL-E2E-STACK ONLY: with prettyUrl=true the Yii urlManager
        # matches paths against its rules. The default
        # fastcgi_split_path_info strips the path when no .php is
        # present in the rewritten URI; we override PATH_INFO to the
        # original request URI so the rules see the full path.
        fastcgi_param  PATH_INFO        $request_uri;
        fastcgi_param  PATH_TRANSLATED  $document_root$fsn;

        # LOCAL-E2E-STACK ONLY: force test-mode bootstrap for every request.
        # web/index.php only switches to YII_ENV=test when $_SERVER['REMOTE_ADDR']
        # is a loopback address. Container-to-container traffic arrives at the
        # fastcgi worker with REMOTE_ADDR set to a 172.x docker-bridge IP, which
        # prevents the test-mode config from loading and routes /test/* through
        # the catch-all. Pinning REMOTE_ADDR to 127.0.0.1 also satisfies
        # TestController's IP allowlist.
        #
        # THIS OVERRIDE IS A LOCAL STACK WORKAROUND. It must never travel into
        # anything upstream-bound — production nginx must report the real client
        # IP (set via the trusted-proxy chain if a reverse proxy sits in front).
        fastcgi_param  REMOTE_ADDR      127.0.0.1;
    }
}
