[package]
name = "antragsgruen_native"
version = "1.0.0"
edition = "2021"
description = "Optional PHP extension speeding up compute-intensive parts of Antragsgrün"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ext-php-rs = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
